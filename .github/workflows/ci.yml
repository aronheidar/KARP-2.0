# LOTA 23 — CI á hverja ýtingu: byggingin verður að standast OG allir innri
# hlekkir að eiga skotmark, ÁÐUR en Cloudflare eyðir byggingarkvóta í hana.
# (Lærdómur 2b72374: brotið build fór út af því exit-staðan var aldrei tékkuð.)
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # 15 dugði fyrir tékk-keyrslu; deploy bætir 1–2 mín við og má ekki klippast af
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deps (vefur)
        run: npm ci
        working-directory: web
      # Úttekt 30.7: 16 prófaskrár (246 próf) keyrðu HVERGI í CI — rotnuðu óséð. ENGIN || true hér: rauð próf fella keyrsluna.
      - name: Einingapróf (web lib + web/test)
        run: node --test src/lib/*.test.mjs src/worker/*.test.mjs test/*.test.mjs
        working-directory: web
      # ⚠ 13.9: skriptur/lib/*.test.mjs voru UTAN gluggans — prófin þar keyrðu hvergi, sami
      # rotnunar-fasi og úttektin 30.7 fann í web. Báðar möppur nú inni.
      - name: Einingapróf (skriptur + skriptur/lib)
        run: node --test skriptur/*.test.mjs skriptur/lib/*.test.mjs
      # Klofningsvörn (C10): worker.js + src/worker/*.mjs mega ekki nota nafn sem hvergi er lýst yfir
      # né flutt inn — hvorki node --check né esbuild grípa það (fannst 19× við klofninginn 30.7).
      - name: Worker-tengingar heilar
        run: node skriptur/ci_worker_bindings.mjs
      - name: Astro-bygging
        run: npx astro build
        working-directory: web
      - name: Worker-þurrbygging (veiðir syntax-villur fyrir deploy)
        run: npx wrangler deploy --dry-run
        working-directory: web
      - name: Innri hlekkjatékk
        run: node skriptur/check_links.js
      - name: Lykilefnis-merki
        run: |
          set -e
          grep -q "Hagvísir Íslands" web/dist/index.html
          grep -q "og-karp.png" web/dist/index.html
          grep -q "bt-cats" web/dist/thingmal/index.html
          echo "✓ Efnismerki til staðar."

      # ⚠⚠ 13.9.2026 — CI DEPLOYAR NÚ. Hér var áður AÐEINS `--dry-run`, og ENGIN leið í öllu repo-inu
      # kom eignum í loftið: `git push origin main` gerði ekkert eitt og sér. Afleiðingin var ekki
      # augljós bilun heldur ÞÖGN — lifandi spyrdu_context.json reyndist FJÖGURRA DAGA GÖMUL þótt
      # refresh-data committi fersk gögn á hverri nóttu, og samhliða session-ir deployuðu handvirkt
      # hver ofan í aðra með mis-ferskt dist/ (sú sem deployaði síðast með elsta trénu vann).
      # ⚠ Skrefið stendur SÍÐAST — á eftir prófum, tengingatékki, byggingu, hlekkjatékki og
      #   efnismerkjum. Falli eitthvað þeirra fer EKKERT í loftið. `--dry-run`-skrefið ofar stendur
      #   áfram sem ódýrt syntax-hlið sem fellur hratt, áður en dýru skrefin keyra.
      # ⚠ `[assets] directory = "./dist"` í wrangler.toml ⇒ wrangler sendir dist/ EINS OG ÞAÐ LIGGUR.
      #   Þess vegna VERÐUR „Astro-bygging" að hafa keyrt á undan í SÖMU keyrslu. Deploy án
      #   undanfarandi byggingar sendir gamalt tré — það gerðist handvirkt 13.9 og sendi eignir frá 9.9.
      - name: Deploy (aðeins main)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
