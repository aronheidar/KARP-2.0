# hladvorp-now — handvirk keyrsla HLAÐVARPSVAKTARINNAR (aðeins hún, ekki þunga gagnapípan).
# Lag 1: lýsigögn úr 11 opnum RSS → web/public/gogn/hladvorp.json (committað). Lag 2: talgreining nýrra þátta
# með Workers AI (@cf/openai/whisper-large-v3-turbo, sömu CF-lyklar og D1) → D1-taflan `hladvorp` — ALDREI í repo
# (repoið er public; höfundaréttur). Nætur-keyrslan (refresh-data.yml) gerir nákvæmlega það sama; þetta er til að
# prófa strax / fylla upp í. ⚠ CLOUDFLARE_API_TOKEN þarf heimildina „Workers AI: Read" — skriptan segir skýrt til.
name: hladvorp-now

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hladvorp-now
  cancel-in-progress: false

jobs:
  hladvorp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deps (wrangler fyrir D1)
        run: npm ci
        working-directory: web
      - name: ffmpeg til staðar?
        run: ffmpeg -version | head -1
      - name: Hlaðvarpsvaktin (lýsigögn + talgreining → D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node skriptur/build_hladvorp.mjs
      - name: Commit + push lýsigögn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/gogn/hladvorp.json
          if git diff --cached --quiet; then
            echo "• Engar breytingar á hladvorp.json."
          else
            git commit -m "Hlaðvarpsvakt: handvirk keyrsla (hladvorp-now)"
            git pull --rebase --autostash origin main || true
            git push
            echo "• hladvorp.json uppfærð og ýtt."
          fi
