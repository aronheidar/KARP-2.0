# Á4 — sjálfvirkur gagnaferskleiki (#1b felld inn í #2).
# ---------------------------------------------------------------------------
# Keyrir CI-öruggu gagnaskriftina build_polls.js reglulega (aðeins fetch á
# Wikipedia — engir lyklar, engin staðbundin skjöl, engar npm-deps).
#   • Breytist polls.json → commit + push → Cloudflare endurbyggir karp21
#     (Astro SSG-síður) → fersk sætaspá. (Gamla WP-mælaborðið/karp-app.js var
#     kvatt 30.7.2026 — sjá docs/uttekt/2026-07-30-heildaruttekt.md B-lið.)
#   • Engin breyting → (valfrjálst) deploy hook þvingar endurbyggingu svo
#     efnahagur sæki ferska verðbólgu frá Hagstofu á byggingartíma.
#     Án hook ferskast efnahagur hvort eð er við næstu polls-ýtingu (~vikulega).
#
# ⚠ Handvirkt áfram (ekki CI-öruggt): sveitarfélaga-gögn (atvinnuleysi/fasteignir
#   = xlsx/xlsm), afbrot, orka o.fl. → sveitarfelog-síðan ferskast við handvirka
#   gogn/-uppfærslu + push. Sjá „Gagnapípan" í wiki.
name: refresh-data

on:
  schedule:
    - cron: '0 6 * * *'      # daglega kl. 06:00 UTC
    # ⚠ Vaxtaákvarðanir Seðlabankans birtast kl. 08:30 (miðvikud.) — EFTIR 06:00-keyrsluna, svo
    # stýrivextir (og vaxta-frétt fréttavélarinnar) duttu annars út um heilan sólarhring.
    - cron: '0 10 * * 3'     # miðvikudaga kl. 10:00 UTC — nær vaxtaákvörðun samdægurs
  workflow_dispatch: {}       # + handvirkt í Actions-flipanum
  repository_dispatch:        # + „🔄 Sækja fersk gögn"-hnappur í /stjorn/ (worker → event_type: refresh)
    types: [refresh]

permissions:
  contents: write             # svo botninn geti committað fersk gögn

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deps (npm-pakkar + pypdf fyrir PDF-þáttun)
        run: |
          npm ci
          python -m pip install --quiet pypdf

      # LOTA 18 #6: allar CI-öruggu skripturnar (aðeins net-fetch + committed deps).
      # || true → ein biluð veita fellir ekki restina; committað er því sem tókst.
      - name: Alþingi (mál, atkvæði, nefndir, dagatal, ræður, laun)
        run: |
          node skriptur/build_althingi.js   || true
          node skriptur/build_frumvorp.js   || true
          node skriptur/build_votes.js      || true
          node skriptur/build_votemap.js    || true
          node skriptur/build_atkvaedi.js   || true
          node skriptur/build_committees.js || true
          node skriptur/build_dagatal.js    || true
          node skriptur/build_cabinet.js    || true
          node skriptur/build_laun.js       || true
          node skriptur/build_speeches.js   || true   # ræðutími per þingmann (raedur/raedumin) → merge í althingi.json (vantaði í pípuna → fraus)
          node skriptur/build_raedur.js     || true
          node skriptur/build_thingskyrsla.js || true   # Þingmannaskýrslan (selda varan): uppreisn/svið/fyrirspurnir/flutt mál
      - name: Kannanir + markaðir + samfélag
        env:
          ARION_OPENDATA_API_KEY: ${{ secrets.ARION_OPENDATA_API_KEY }}
          ARION_OPENDATA_CLIENT_ID: ${{ secrets.ARION_OPENDATA_CLIENT_ID }}
          ARION_OPENDATA_CLIENT_SECRET: ${{ secrets.ARION_OPENDATA_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SC_KEY_JSON: ${{ secrets.GOOGLE_SC_KEY_JSON }}
        run: |
          node skriptur/build_polls.js          || true
          node skriptur/build_markadir.js       || true
          node skriptur/build_arion.js          || true
          node skriptur/build_leitarvel.js      || true
          node skriptur/build_raunvirdi.js      || true
          node skriptur/build_sveitarstjorar.js || true
          node skriptur/build_pep.js            || true
          node skriptur/build_sendirad.js       || true
          node skriptur/build_utbod.js          || true
          node skriptur/build_uppbod.js         || true
          node skriptur/build_ytsaga.js         || true
          node skriptur/build_ytsafn.js         || true
      # FIT-ÞREP 3: hæfiskröfu-þáttun TED-útboða með Claude (structured output).
      # ⚠ Sleppir sér hljóðlega þar til ANTHROPIC_API_KEY er sett í GitHub Secrets.
      #   Keyrir Á EFTIR build_utbod (les gogn/utbod.json); stigvaxandi — aðeins ný útboð.
      - name: Hæfiskröfur útboða (Claude-þáttun, krefst ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node skriptur/build_utbod_haefi.mjs || true
      - name: Þyngri veitur (HMS, VMST, lögregla, orka, Numbeo, Fiskistofa)
        env:
          GOOGLE_GEOCODE_KEY: ${{ secrets.GOOGLE_GEOCODE_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          node skriptur/build_fasteignir.js   || true
          node skriptur/build_fasteignaskra.js || true
          node skriptur/build_leiga.js        || true
          node skriptur/build_leiga_cpi.mjs   || true   # Hagstofa CPI-leiga (fersk 12-mán breyting; HMS-skrá fraus 2024F1)
          node skriptur/build_atvinnuleysi.js || true
          node skriptur/build_glaepir.js      || true
          node skriptur/build_orka.js         || true
          node skriptur/build_numbeo.js       || true
          node skriptur/build_sjavarutvegur.js || true   # Fiskistofa: raðköll m/töf (þjöppun/afli per tegund)
          node skriptur/build_sedlabanki.js   || true   # Seðlabanki XML: vextir/gengi/verðbólga/peningamál
          node skriptur/build_eftirlit.js     || true   # HER: matvæla-/heilbrigðiseftirlit RVK (crawl póstnr+leitarorð)
          node skriptur/build_stadfong.js     || true   # Staðfangaskrá RVK (opin CSV → götu→hnit vísir, á undan hnitara)
          node skriptur/build_eftirlit_hnit.js || true  # hnitar eftirlit f. Leaflet-kort (Staðfangaskrá frítt + Google fallback)
          node skriptur/build_vorumerki_nyskrad.js || true   # Hugverkastofan: nýskráð vörumerki (tilkynninga-vakt → digest)
          node skriptur/build_styrkir.js      || true   # Opinberar styrkveitingar (6 sjóðir → nafn→úthlutun; /api/styrkir + #fs-styrkir)
          node skriptur/build_ees.js          || true   # EES-vaktin: 3 þrep (CELLAR ESB-gerðir + EES-nefnd ákvarðanir + Alþingi EES-mál) → gogn/ees.json
          # Sérlyfjaskrá (Lyfjastofnun): grunngögn + LYFJASKORTUR (tímaviðkvæmt) fersk DAGLEGA; verð borin fram (X ?? prev.X) svo bundin sókn tapi ekki verðum.
          #   1. hvers mánaðar (UTC) = full verð-endurnýjun (öll ~3023, ~75 mín); aðra daga forgangs-verð LYF_PRICE_MAX=400 (allur skortur + efstu nauðsyn, ~8 mín).
          if [ "$(date -u +%d)" = "01" ]; then node skriptur/build_lyf.js || true; else LYF_PRICE_MAX=400 node skriptur/build_lyf.js || true; fi
      - name: Byggingarleyfi (opnar fundargerðir byggingarfulltrúa RVK → byggingarsaga heimilisfangs)
        run: python skriptur/build_byggingarleyfi.py || true   # pypdf; full endurbygging (271 PDF, PDF-cache); heimilisfangs-lyklað, PII-örugg þáttun — engin persónuupplýsing geymd
      - name: Lögbirtingablaðið (opin PDF-tölublöð → lögform. tilkynningar lögaðila á kt)
        run: python skriptur/build_logbirting.py || true   # pypdf; incremental (seen-set í gogn/); persónuvernd: aðeins lögaðilar (gjaldþrot/innköllun/skiptalok/félagsslit)
      - name: AI-samantektir (skilyrt á ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            node skriptur/build_summaries.js || true
            node skriptur/build_malrof_ai.js || true
            node skriptur/build_domar_ai.js  || true
            node skriptur/build_thingskyrsla_ai.js || true   # djúp AI-greining Þingmannaskýrslunnar (inkremental + endurnýjun v/+30% ræðna)
          else
            echo "• Enginn ANTHROPIC_API_KEY-secret — AI-skriftum sleppt."
          fi
      - name: Útboðsniðurstöður (TED awards + LV opnanir; á undan fréttavél)
        run: node skriptur/build_urslit.js || true
      - name: Tengslagrunnur → „sama fyrirsvar" AGGREGATE-tölur (D1; nafnlaust; á undan fréttavél)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node skriptur/export_tengsl_fonix.mjs || true   # sleppir sjálft ef leyndarlyklar vantar; skrifar aðeins heildartölur
      - name: Fréttavélin (gagnaatburðir → fréttir; AI-skrif ef lykill)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node skriptur/build_frettavel.js || true
      - name: Hlaðvarpsvaktin (lýsigögn alltaf; talgreining ef OPENAI_API_KEY + CF-lyklar → D1)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node skriptur/build_hladvorp.mjs || true   # umritanir fara í D1 (repo er public) — aldrei í gogn/
      - name: Samhengispakki Spyrðu Karp (úr ferskum gögnum)
        run: node skriptur/build_spyrdu_context.js || true
      - name: RAG-afrit í public (sveitarstjórar, ráðherrar, þingmenn, atvinnuleysi…)
        run: node skriptur/build_ragcopy.js || true
      - name: Greinar-viðmið (Hagstofa FYR08010) + öfugt eignarhaldsnet (F2/F4)
        run: |
          node skriptur/build_sector.mjs           || true   # Hagstofa: greinar-hlutföll á ÍSAT → sector_kpi.json (breytist árlega)
          node skriptur/build_eigendur_reverse.mjs || true   # snýr við gogn/eigendur/*.json → eigendur_reverse.json (lítið, vex á-eftirspurn)
          node skriptur/build_rekstrarleyfi.mjs    || true   # Sýslumenn rekstrarleyfi (veitingar/gisting/vínveiting) → rekstrarleyfi.json (áfangi 1 leyfaskrár)
          node skriptur/build_ferdaleyfi.mjs       || true   # Ferðamálastofa leyfishafar (ferðaskrifstofur+dagsferðir) → ferdaleyfi.json (áfangi 1 leyfaskrár)
          node skriptur/build_apotek.mjs           || true   # Lyfjastofnun apótek/lyfjasölur (leyfisskyld starfsemi) → apotek.json (áfangi 1 leyfaskrár)
          node skriptur/build_stjornartidindi.mjs  || true   # Stjórnartíðindi: nýjustu lög/reglugerðir/auglýsingar → stjornartidindi.json (island.is officialJournalOfIcelandAdverts)

      - name: Lobbývakt — flokka þingmál + samráðsmál eftir atvinnugrein (AI-brief ef lykill, annars heuristík)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node skriptur/build_lobbyvakt.mjs || true   # frumvorp.json (þingmál) + samráðsgátt → lobbyvakt.json + cache (Lobbývakt v1)

      - name: RÁS-þingmál — efnahagsflokkun frumvarpa + projection í frumvorp.json (úttekt 30.7 — var ALDREI í CI, b.ras staðnaði/hvarf við daglega yfirskrift)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node skriptur/build_thingmal_ras.mjs || true   # les frumvorp.json (byggt að ofan) → bakar b.ras + thingmal_ras.json cache; lyklalaus keyrsla cache-ar EKKERT

      - name: Kvótavaktin — aflamark flotans per útgerð (VIKULEGA á mánudögum; ELLA þvingað við handræsingu úr stjórnborði)
        env:
          FORCE_WEEKLY: ${{ github.event_name != 'schedule' }}   # handræst (workflow_dispatch/repository_dispatch) → keyra óháð vikudegi
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$FORCE_WEEKLY" = "true" ]; then node skriptur/build_kvoti.mjs || true; fi

      # Úttekt 30.7 (C6): tvær skriptur með lifandi úttak voru HVERGI í CI (sveitarfelog_adm2 20d,
      # sitemap-fyrirtaeki aldrei endurbyggð). Vikulega á mánudögum nægir (breytast hægt).
      # ⚠ HANDVIRKAR VEITUR (viljandi, enginn framleiðandi í repo): ivilnanir.json, skattar.json,
      #   utgjold.json, landshlutar.json — uppfærast með höndunum þegar tilefni er til.
      - name: Sveitarfélaga-fjölhyrningar + fyrirtækja-sitemap (VIKULEGA á mánudögum)
        env:
          FORCE_WEEKLY: ${{ github.event_name != 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$FORCE_WEEKLY" = "true" ]; then
            node skriptur/build_sveitarfelog_geo.js   || true   # geoBoundaries ADM2 → sveitarfelog_adm2.json (choropleth)
            node skriptur/build_sitemap_fyrirtaeki.mjs || true  # kt-lykluð gögn → web/public/sitemap-fyrirtaeki.xml
          fi

      - name: Hagstofa þjóðhags-snapshot (mælaborðssíður — áður frontmatter-fetch á hverri byggingu)
        run: |
          node skriptur/build_hagvoxtur.mjs   || true   # VLF ársfj + VLF-Sankey + Norðurlönd (WB) + IMF-hagvaxtarspá → hagvoxtur.json
          node skriptur/build_mannfjoldi.mjs  || true   # mannfjöldi ársfj + þættir fjölgunar + innflytjendur → mannfjoldi.json
          node skriptur/build_menntun.mjs     || true   # menntunarstaða 25–64 (ISCED) + háskóla-YoY → menntun.json
          node skriptur/build_ferdathjonusta.mjs || true   # KEF-farþegar (SAM02001) + gistinætur (SAM01601) → ferdathjonusta.json
          node skriptur/build_landbunadur.mjs || true   # kjötframleiðsla (LAN10201) + búfé (LAN10102) → landbunadur.json
          node skriptur/build_storidja.mjs    || true   # útflutningsverðmæti ál/kísiljárn (UTA06105) → storidja.json
          node skriptur/build_rafbilar.mjs    || true   # bílafloti eftir orkugjafa (SAM30120) → rafbilar.json
          node skriptur/build_umferd.mjs      || true   # KEF-farþegar heild (SAM02001) → umferd.json (lifandi vegaumferð/flug er client-proxy)
          node skriptur/build_vidskipti.mjs   || true   # utanríkisverslun (UTA06105/06202/06108/06002/06003) → vidskipti.json
          node skriptur/build_verdlag.mjs     || true   # verðbólga (VIS01000) + uppruni (VIS01101) + karfa (VIS01300) + FX + IMF-verðbólguspá → verdlag.json
          node skriptur/build_vinnumarkadur.mjs || true # laun vs verðbólga / kaupmáttur (LAU04001 + VIS01000) → vinnumarkadur.json
          node skriptur/build_audlindir.mjs   || true   # ferðamenn (SAM02001) + CO2 á mann (OWID) → audlindir.json
          node skriptur/build_furduhagfraedi.mjs || true # launakapphlaupið: laun/húsnæði/verðlag (LAU04000/VIS01106/VIS01000) → furduhagfraedi.json
          node skriptur/build_hugverk.mjs     || true   # R&Þ-útgjöld (FYR05101) + nýskráð vörumerki (Hugverkastofan) → hugverk.json

      # RAUNTÍMA ROADS: keyrt Á EFTIR öllum gagna-veitum svo BAU-ferlar (vextir/verðbólga/húsnæði/atvinnuleysi/leiga…) séu alltaf á „í dag".
      - name: ROADS hermir (endurkvarða BAU + söguleg bakprófun úr ferskum gögnum)
        run: |
          node skriptur/build_roads.mjs        || true   # baseline/links/scenarios úr ferskum SÍ/Hagstofu/Þjóðskrá → grunnferill alltaf á núgildi
          node skriptur/verify_roads_model.mjs || true   # heilbrigðis-eftirlit (feedback-regla/BAU/ci)
          node skriptur/backtest_history.mjs   || true   # söguleg bakprófun 2010–2026 → gogn/roads/history.json
          node skriptur/calibrate_roads.mjs    || true   # econometrísk kvörðun (OLS) → gogn/roads/calibration.json

      # Nýjar fréttir fá lexíkon-tón strax við innlestur (worker newsIngest → sent), en AI-matið
      # (sent_ai) er NULL þar til hér. Skriptan er ENDURRÆSANLEG og tekur aðeins `sent_ai IS NULL`
      # → daglega skorast bara nýja efnið (~200-500 fréttir, <1 mín). Þakið bindur versta tilfelli.
      - name: Viðhorfsgreining nýrra frétta (Claude Haiku → news.sent_ai)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node skriptur/build_sentiment_ai.mjs --limit 3000 || true   # sleppir sjálft ef lyklar vantar

      # FATF adverse media (10. KYC-merkið): match-fyrst (aðeins fréttir VAKTAÐRA félaga),
      # Sonnet-flokkun, skrifar í FROSNU töflurnar kyc_adverse/kyc_adverse_sed/kyc_tonn.
      # Keyrir Á EFTIR sentiment (kyc_tonn frystir sent_ai-meðaltöl). Worker les aðeins.
      - name: Adverse media-flokkun vaktaðra KYC-félaga (FATF → kyc_adverse)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node skriptur/build_adverse_media.mjs --limit 300 || true   # sleppir sjálft ef lyklar vantar

      # Áhættumats-greinargerð (drög) per vaktað félag — endurmyndast AÐEINS við breytt samhengi
      # (hash-gát = núll tóken á óbreyttum félögum). Keyrir Á EFTIR adverse (les kyc_adverse/kyc_tonn).
      - name: Áhættumats-greinargerðir vaktaðra félaga (→ kyc_greinargerd)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node skriptur/build_kyc_greinargerd.mjs || true   # sleppir sjálft ef lyklar vantar

      # Fjölmiðlavogin BYGGIR Á sent_ai → keyrir Á EFTIR viðhorfsgreiningunni hér að ofan.
      - name: Fjölmiðlavog (tón-hlutdrægni leiðrétt fyrir efnisvali → midlavog.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node skriptur/build_midlavog.mjs || true

      - name: Gagnaheilsa (ferskleiki lykil-veita + þekja → heilsa.json fyrir stjórnborð)
        run: node skriptur/build_heilsa.mjs || true   # LES nýuppfærðar veitur → web/public/gogn/heilsa.json (á UNDAN commit svo hún fylgi með)

      - name: Committa ef breyting — annars þvinga endurbyggingu
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          # status --porcelain sér líka NÝJAR skrár (git diff gerir það ekki)
          CHANGES=$(git status --porcelain -- gogn/ web/public/gogn/ | head -40)
          if [ -n "$CHANGES" ]; then
            echo "── Breytt/nýtt:"; echo "$CHANGES"
            git config user.name  "karp-bot"
            git config user.email "karp-bot@users.noreply.github.com"
            git add -A gogn/ web/public/gogn/       || { echo "✗ git add brást"; exit 1; }
            git commit -m "data: sjálfvirk gagnauppfærsla ($(date -u +%F))" || { echo "✗ git commit brást"; exit 1; }
            # race-vörn: eitthvað gæti hafa lent á main á meðan skripturnar keyrðu.
            # ⚠ --autostash NAUÐSYNLEGT: skriftur skilja stundum eftir ÓSVIÐSETTAR breytingar UTAN
            #   gogn/ (aðeins gogn/+web/public/gogn/ eru add-að) → „cannot pull with rebase: You have
            #   unstaged changes" felldi rebase OG push → 52 ferskar gagnaskrár töpuðust (27.-29.7).
            git pull --rebase --autostash origin main || echo "⚠ rebase brást — reyni push samt"
            if ! git push origin HEAD:main; then
              echo "⚠ push hafnað — sæki aftur og reyni einu sinni enn…"
              git pull --rebase --autostash origin main
              git push origin HEAD:main || { echo "✗ push brást endanlega — athugaðu branch protection á main (leyfa github-actions að ýta) og Settings→Actions→Workflow permissions (Read and write)."; exit 1; }
            fi
            echo "✔ Gögn breyttust → ýtt. Cloudflare endurbyggir bæði verkefnin."
          elif [ -n "$CF_DEPLOY_HOOK" ]; then
            # dauður/rangur hook á ekki að fella keyrsluna
            curl -fsS -X POST "$CF_DEPLOY_HOOK" >/dev/null \
              && echo "✔ Engin gagnabreyting → deploy hook þvingaði endurbyggingu (fersk Hagstofa)." \
              || echo "⚠ Deploy hook svaraði ekki (hunsa) — uppfærðu/eyddu CF_DEPLOY_HOOK-secretinu."
          else
            echo "• Engin breyting og enginn CF_DEPLOY_HOOK — sleppi. efnahagur ferskast við næstu gagna-ýtingu."
          fi

      # Úttekt 30.7 (C1): 80× `|| true` + „commit ef breyting" gerði bilanir ÓSÝNILEGAR (OneDrive-frost,
      # lobbyvakt-eitrun). Hliðið keyrir EFTIR commit/push (gögnin skila sér alltaf) og fellur keyrsluna
      # (rauð + tafla í summary) ef lykil-veita úr heilsa.json er yfir þolmörkum. EKKERT || true hér.
      - name: Heilsu-hlið — rauð keyrsla ef lykil-veita staðnaði
        run: node skriptur/ci_heilsugate.mjs
