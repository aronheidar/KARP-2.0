name: CTO (lagfæring úr hjálparbeiðni → PR)

# Fasi 2 í þjónustufulltrúa-flæðinu: worker sendir repository_dispatch { ticket } þegar Aron smellir
# „Senda á CTO" á /stjorn/ (eða handvirkt hér). Claude Code keyrir í CI með skrifaðgang að repoinu,
# finnur og lagar villuna í sér-grein, prófin verða að vera græn, og skilar PR + samantekt aftur á
# /api/admin/ticket (cto_result) → Aron fær póst og samþykkir með einum smelli (merge = deploy).
# Girðingar: aðeins web/ og skriptur/ mega breytast; ALDREI migrations/, wrangler.toml, .github/ eða leyndarmál.

on:
  repository_dispatch:
    types: [cto]
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Ticket-númer (tickets.id í D1)'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cto-${{ github.event.client_payload.ticket || inputs.ticket }}
  cancel-in-progress: false

jobs:
  laga:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TICKET: ${{ github.event.client_payload.ticket || inputs.ticket }}
      KARP_ADMIN_KEY: ${{ secrets.KARP_ADMIN_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sækja ticket úr karp.is
        run: |
          curl -sf -H "X-Admin-Key: $KARP_ADMIN_KEY" "https://karp.is/api/admin/ticket?id=$TICKET" -o ticket.json
          node -e "const t=require('./ticket.json'); if(!t.ok) throw new Error('ticket '+JSON.stringify(t)); console.log('#'+t.ticket.id, t.ticket.tegund, '—', t.ticket.efni)"
      - name: Deps (web)
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Claude Code — greina og laga
        run: |
          npm i -g @anthropic-ai/claude-code
          node -e "
            const t=require('./ticket.json').ticket; let g={}; try{g=JSON.parse(t.ai_greining||'{}')}catch(e){}
            const p=[
              'Þú ert CTO Karp (karp.is — Astro-vefur í web/ + Cloudflare Worker web/worker.js og web/src/worker/*.mjs, gögn í gogn/ byggð af skriptur/).',
              'Hjálparbeiðni #'+t.id+' frá notanda ('+(t.flokkur||'')+', tegund '+(t.tegund||'')+'):',
              '--- ERINDI ---', t.lysing, '--- CTO-BRIEF ÞJÓNUSTUFULLTRÚA ---', g.cto_brief||'(enginn)', '---',
              'VERKEFNI: Finndu rót vandans í kóðanum og gerðu MINNSTU öruggu lagfæringu. Bættu við eða uppfærðu próf ef við á.',
              'REGLUR: (1) Breyttu AÐEINS skrám undir web/ eða skriptur/ — aldrei web/migrations/, web/wrangler.toml, .github/, leyndarmálum eða greiðslukóða (askell/teya). (2) Keyrðu `npm test` í web/ og skilaðu ekki með rauðum prófum. (3) Ef þú finnur EKKI raunverulega villu í kóða (t.d. spurning, misskilningur, gagnavilla frá heimild) → breyttu ENGU og skrifaðu það í samantektina með rökum og tillögu um svar til notandans.',
              'SKILA: skrifaðu skrána cto_summary.md í rót repo-sins á íslensku með köflunum: Hvað var að · Hvað var lagað (skrár) · Áhætta/afturkræfni · Tillaga að svari til notandans (2–4 línur). Ekkert annað í skránni.'
            ].join('\n');
            require('fs').writeFileSync('cto_prompt.txt', p);
          "
          claude -p "$(cat cto_prompt.txt)" --permission-mode bypassPermissions --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm test:*),Bash(node:*),Bash(npx astro check:*)" --max-turns 60 > cto_run.log 2>&1 || true
          tail -c 3000 cto_run.log
          test -f cto_summary.md || { echo "engin samantekt frá Claude — bý til varasamantekt"; printf '## Hvað var að\nCTO-agentinn skilaði ekki samantekt (sjá keyrslu-log).\n## Hvað var lagað\nEngar breytingar.\n## Áhætta\nEngin.\n## Tillaga að svari\nÞarf handvirka skoðun.\n' > cto_summary.md; }
      - name: Próf verða að vera græn
        run: npm test
        working-directory: web
      - name: Grein + PR (eða „engin breyting")
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "karp-cto"
          git config user.email "hjalp@karp.is"
          rm -f ticket.json cto_prompt.txt cto_run.log
          SUM=$(cat cto_summary.md)
          rm -f cto_summary.md
          # aðeins leyfðar slóðir mega hafa breyst
          BAD=$(git status --porcelain | awk '{print $2}' | grep -vE '^(web/|skriptur/)' | grep -vE '^web/migrations/|^web/wrangler.toml' || true)
          BAD2=$(git status --porcelain | awk '{print $2}' | grep -E '^web/migrations/|^web/wrangler.toml|^\.github/' || true)
          if [ -n "$BAD$BAD2" ]; then echo "Óleyfilegar breytingar: $BAD $BAD2"; git checkout -- . ; git clean -fd; echo "pr=" >> $GITHUB_OUTPUT; echo "note=Óleyfilegar skrár snertar — breytingum hent" >> $GITHUB_OUTPUT; exit 0; fi
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo "pr=" >> $GITHUB_OUTPUT; echo "note=Engin kóðabreyting" >> $GITHUB_OUTPUT; printf '%s' "$SUM" > /tmp/sum.md; exit 0; fi
          BR="cto/ticket-$TICKET"
          git checkout -b "$BR"
          git add -A web skriptur
          git commit -q -m "CTO: lagfæring úr hjálparbeiðni #$TICKET" -m "$SUM"
          git push -u origin "$BR" --force
          URL=$(gh pr create --title "CTO: hjálparbeiðni #$TICKET" --body "$SUM"$'\n\n'"Ticket: https://karp.is/stjorn/#ticket-$TICKET · Samþykki Arons = merge (deploy sjálfvirkt)." --base main --head "$BR" 2>/dev/null || gh pr view "$BR" --json url -q .url)
          echo "pr=$URL" >> $GITHUB_OUTPUT
          echo "note=" >> $GITHUB_OUTPUT
          printf '%s' "$SUM" > /tmp/sum.md
      - name: Skila niðurstöðu á karp.is
        if: always()
        run: |
          SUM=$( [ -f /tmp/sum.md ] && cat /tmp/sum.md || echo "Keyrsla mistókst — sjá Actions-log" )
          node -e "
            const body={action:'cto_result', id: Number(process.env.TICKET), pr: process.env.PR||'', branch: process.env.PR ? 'cto/ticket-'+process.env.TICKET : '', samantekt: (process.env.NOTE ? process.env.NOTE+'\n\n' : '') + require('fs').readFileSync('/tmp/sum.md','utf8').slice(0,3800)};
            fetch('https://karp.is/api/admin/ticket',{method:'POST',headers:{'X-Admin-Key':process.env.KARP_ADMIN_KEY,'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.text()).then(t=>console.log('cto_result →',t));
          " || true
        env:
          PR: ${{ steps.pr.outputs.pr }}
          NOTE: ${{ steps.pr.outputs.note }}
